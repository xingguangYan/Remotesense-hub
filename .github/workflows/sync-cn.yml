name: deploy-modelscope

on:
  # 推送到 master 即自动构建并部署国内站（ModelScope Docker 创空间）
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # 每小时兜底同步一次（UTC 整点，即北京时间整点）
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 镜像构建 + 启动轮询上限 10 分钟，留足余量
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 检查必需的 secret
        run: |
          if [ -z "${MODELSCOPE_TOKEN}" ]; then
            echo "::error::缺少 GitHub Secret：MODELSCOPE_TOKEN（ModelScope 访问令牌）。"
            exit 1
          fi
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}

      - name: 推送源码并部署 ModelScope 创空间
        run: node scripts/deploy-modelscope-app.mjs
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}

      - name: 部署失败告警
        if: failure()
        run: |
          echo "::error::ModelScope 创空间部署失败，下次定时任务会自动重试"
